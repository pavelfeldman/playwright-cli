name: Publish
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-npm:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC npm publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Validate plugin.json version matches package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            const plugin = require('./plugin.json');
            if (plugin.version !== pkg.version) {
              console.error(\`plugin.json is out of sync with package.json: plugin.version=\${plugin.version} != package.version=\${pkg.version}\`);
              process.exit(1);
            }
          "
      - run: npm publish
